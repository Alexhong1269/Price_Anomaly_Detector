<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Price Anomaly Detector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <h1 class="app-title">Price Anomaly Detector</h1>

    <!-- Shown briefly while popup.js looks up stored data for this tab -->
    <div id="loading-state" class="state">
      <p>Loading…</p>
    </div>

    <!-- Shown when there's no data for the current tab (e.g. not an
         Amazon product page, or the page hasn't finished scraping yet) -->
    <div id="empty-state" class="state hidden">
      <p>No product data for this page yet.</p>
      <p class="hint">Visit a supported Amazon product page to see a verdict.</p>
    </div>

    <!-- Main result view -->
    <div id="result-state" class="state hidden">
      <p id="product-title" class="product-title"></p>
      <p id="product-price" class="product-price"></p>

      <div id="verdict-badge" class="verdict-badge"></div>

      <div id="cheaper-section" class="cheaper-section hidden">
        <p class="cheaper-label">Found it cheaper:</p>
        <a id="cheaper-link" href="#" target="_blank" rel="noopener">
          <span id="cheaper-title" class="cheaper-title"></span>
          <span id="cheaper-price" class="cheaper-price"></span>
        </a>
      </div>

      <div id="no-cheaper-section" class="hidden">
        <p class="hint">No cheaper alternative found on Amazon.</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
